# Weekly update PRs for every ecosystem in the repository. Security updates are raised immediately anyway.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      test:
        patterns: ["xunit*", "FluentAssertions", "Testcontainers*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "vue", "vue-router", "vue-tsc"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/JobAutopilot.sln

      - name: Build
        run: dotnet build backend/JobAutopilot.sln --configuration Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      # CI=true makes them fail instead of being skipped if Docker is missing.
      - name: Test
        run: dotnet test backend/JobAutopilot.sln --configuration Release --no-build

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the output is checked.
      - name: Vulnerable NuGet packages (fail on high/critical)
        run: |
          dotnet list backend/JobAutopilot.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::High or critical vulnerable NuGet packages found"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # npm audit --audit-level=high, with documented, time-boxed exceptions (audit-allowlist.json) for advisories
      # that have no fix yet; allowlisted packages must not be in the production bundle.
      - name: npm audit (fail on high/critical)
        run: node scripts/audit-check.mjs --bundle .output

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start db + api + web
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:5080/health/ready
          curl -fsS http://localhost:5080/health/live
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS "http://localhost:5080/api/vacancies?pageSize=1"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

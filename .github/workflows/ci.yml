name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/JobAutopilot.sln

      - name: Build
        run: dotnet build backend/JobAutopilot.sln --configuration Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      # CI=true makes them fail instead of being skipped if Docker is missing.
      - name: Test
        run: dotnet test backend/JobAutopilot.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start db + api + web
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:5080/health
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS "http://localhost:5080/api/vacancies?pageSize=1"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build backend
        if: matrix.language == 'csharp'
        run: dotnet build backend/JobAutopilot.sln --configuration Release

      # Code scanning (the Security tab) is free for public repositories; a private repository needs GitHub
      # Code Security. Without it the upload fails, so private repositories analyse without uploading and gate on
      # the SARIF below instead.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Keep SARIF results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore

      - name: Fail on high/critical findings
        run: python3 .github/scripts/sarif-gate.py sarif-results
